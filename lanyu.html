<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蘭雨 — 龜山島文字雨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 只下載「蘭雨」兩個字的子集，載入快 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&display=swap&text=%E8%98%AD%E9%9B%A8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6c7d8a; }
  canvas { display: block; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
/* =========================================================
   蘭雨 — 以雨滴粒子聚成文字，背景為宜蘭龜山島海景
   流程：海景細雨 → 聚字(8s) → 停留(5s) → 散落入海 → 循環
   ========================================================= */

const WORD = '蘭雨';
const FONT_STACK = '"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU","MingLiU",serif';

// 時間軸（秒）
const T_INTRO = 2.5, T_GATHER = 8, T_HOLD = 5, T_DISS = 4.5, T_REST = 2;
const T_HOLD_END = T_INTRO + T_GATHER + T_HOLD;
const CYCLE = T_HOLD_END + T_DISS + T_REST;

const WIND = -0.12;                       // 雨絲斜度 (vx / vy)
const ALPHAS = [0.35, 0.55, 0.75, 0.95];  // 文字粒子透明度分組

let W, H, sc, horizon, bg, mistSprite;
let fontReady = false, clock = 0, sinceStart = 0, cycleIdx = -1;
let drops = [];      // 文字粒子
let rain = [];       // 環境細雨
let ripples = [];    // 海面漣漪
let waves = [];      // 細浪
let mists = [];      // 薄霧
let stepPx = 3;      // 取樣間距
let resizeTimer = null;

const ss = x => { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); };

/* ---------- 初始化 ---------- */

function setup() {
  pixelDensity(Math.min(window.devicePixelRatio || 1, 2));
  createCanvas(windowWidth, windowHeight);
  mistSprite = makeMistSprite();
  buildScene();
  waitForFont().then(() => {
    fontReady = true;
    buildText();
  });
}

// 確認字型真的載入完成後才取樣；逾時則退回系統的繁中襯線字型
function waitForFont() {
  const spec = '700 64px "Noto Serif TC"';
  const timeout = new Promise(res => setTimeout(res, 10000));
  const load = (document.fonts && document.fonts.load)
    ? document.fonts.load(spec, WORD)
        .then(() => document.fonts.ready)
        .catch(() => {})
    : Promise.resolve();
  return Promise.race([load, timeout]);
}

function windowResized() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resizeCanvas(windowWidth, windowHeight);
    buildScene();
    if (fontReady) buildText();
  }, 150);
}

function buildScene() {
  W = width; H = height;
  sc = H / 800;
  horizon = H * 0.68;
  buildBackground();
  buildRain();
  buildWaves();
  buildMists();
  ripples = [];
}

/* ---------- 文字取樣：離屏畫布 → 像素 → 粒子目標 ---------- */

function buildText() {
  const mobile = Math.min(W, H) < 600;
  const fs = Math.min(W * 0.40, H * 0.30);
  const gap = fs * 0.10;
  stepPx = fs / (mobile ? 60 : 72);

  const S = 2;                                   // 離屏畫布以 2 倍解析度繪製
  const cw = Math.ceil((fs * 2 + gap + fs * 0.4) * S);
  const ch = Math.ceil(fs * 1.5 * S);
  const off = document.createElement('canvas');
  off.width = cw; off.height = ch;
  const c = off.getContext('2d', { willReadFrequently: true });
  c.fillStyle = '#fff';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.font = `700 ${fs * S}px ${FONT_STACK}`;
  const half = (fs + gap) / 2 * S;
  c.fillText(WORD[0], cw / 2 - half, ch / 2);
  c.fillText(WORD[1], cw / 2 + half, ch / 2);

  const data = c.getImageData(0, 0, cw, ch).data;
  const cell = Math.max(2, Math.round(stepPx * S));
  const ox = W / 2 - cw / (2 * S), oy = H * 0.40 - ch / (2 * S);
  const pts = [];
  // 每個格子計算墨色覆蓋率與重心：粒子落在筆畫上，細筆畫與留白都能保留
  for (let gy = 0; gy + cell <= ch; gy += cell) {
    for (let gx = 0; gx + cell <= cw; gx += cell) {
      let sa = 0, sx = 0, sy = 0;
      for (let y = gy; y < gy + cell; y++) {
        let i = (y * cw + gx) * 4 + 3;
        for (let x = gx; x < gx + cell; x++, i += 4) {
          const a = data[i];
          if (a) { sa += a; sx += a * x; sy += a * y; }
        }
      }
      const cov = sa / (255 * cell * cell);
      if (cov > 0.12) {
        pts.push({
          x: ox + (sx / sa + 0.5) / S,
          y: oy + (sy / sa + 0.5) / S,
          cov
        });
      }
    }
  }

  drops = pts.map(p => ({
    tx: p.x, ty: p.y,
    x: 0, y: 0, vx: 0, vy: 0,
    sb: p.cov > 0.7 ? 2 : p.cov > 0.35 ? 1 : 0,   // 水珠大小分組
    state: 0,            // 0 未出現 1 飛向目標 2 定位 3 散落 4 已入海
    delay: 0, rel: 0, born: 0, landY: 0,
    phase: Math.random() * Math.PI * 2,
    tw: 0.7 + Math.random() * 1.6
  }));
  clock = 0;
  cycleIdx = -1;
}

function startCycle() {
  for (const p of drops) {
    p.state = 0;
    p.delay = T_INTRO + Math.random() * 5.2;                  // 陸續被吸引
    p.rel = T_HOLD_END + Math.sqrt(Math.random()) * 2.6;      // 先少後多地散落
    p.landY = horizon + (0.04 + 0.9 * Math.pow(Math.random(), 1.6)) * (H - horizon);
  }
}

/* ---------- 背景：天空、海、龜山島 ---------- */

// 由西岸（頭城）望去的龜山島：左為龜尾、中為龜甲、右為龜首
const ISLAND = [
  [0.00, 0.00], [0.05, 0.025], [0.11, 0.06], [0.17, 0.16], [0.23, 0.38],
  [0.29, 0.62], [0.35, 0.83], [0.41, 0.95], [0.47, 1.00], [0.53, 0.96],
  [0.59, 0.84], [0.64, 0.64], [0.685, 0.42], [0.72, 0.27], [0.75, 0.22],
  [0.78, 0.27], [0.815, 0.42], [0.85, 0.54], [0.885, 0.58], [0.92, 0.52],
  [0.95, 0.36], [0.975, 0.16], [1.00, 0.00]
];

function islandPoints(x0, w, h) {
  const out = [], n = ISLAND.length;
  const P = i => ISLAND[Math.max(0, Math.min(n - 1, i))];
  for (let i = 0; i < n - 1; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let k = 0; k < 10; k++) {
      const t = k / 10, t2 = t * t, t3 = t2 * t;
      const cr = (a, b, c, d) => 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (3 * b - a - 3 * c + d) * t3);
      const u = cr(p0[0], p1[0], p2[0], p3[0]);
      let v = Math.max(0, cr(p0[1], p1[1], p2[1], p3[1]));
      // 細微的山稜起伏
      v += (Math.sin(u * 61) * 0.012 + Math.sin(u * 137 + 1.3) * 0.007) * Math.min(1, v * 4);
      out.push([x0 + u * w, v * h]);
    }
  }
  out.push([x0 + w, 0]);
  return out;
}

function buildBackground() {
  bg = createGraphics(W, H);
  const c = bg.drawingContext;

  // 天空
  let g = c.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#586876');
  g.addColorStop(0.55, '#7f909c');
  g.addColorStop(1, '#b3bdc0');
  c.fillStyle = g; c.fillRect(0, 0, W, horizon + 1);

  // 海
  g = c.createLinearGradient(0, horizon, 0, H);
  g.addColorStop(0, '#a3afb4');
  g.addColorStop(0.18, '#8497a2');
  g.addColorStop(1, '#4d6170');
  c.fillStyle = g; c.fillRect(0, horizon, W, H - horizon);

  // 龜山島
  const iw = Math.min(W * 0.62, Math.max(H * 0.55, 240));
  const ih = iw * 0.21;
  const ix = W * 0.55 - iw / 2;
  const pts = islandPoints(ix, iw, ih);

  // 倒影
  c.beginPath();
  c.moveTo(pts[0][0], horizon);
  for (const p of pts) c.lineTo(p[0], horizon + p[1] * 0.42);
  c.closePath();
  g = c.createLinearGradient(0, horizon, 0, horizon + ih * 0.42);
  g.addColorStop(0, 'rgba(84,100,112,0.34)');
  g.addColorStop(1, 'rgba(84,100,112,0)');
  c.fillStyle = g; c.fill();

  // 島身：上深下淺，底部融入海霧
  c.beginPath();
  c.moveTo(pts[0][0], horizon);
  for (const p of pts) c.lineTo(p[0], horizon - p[1]);
  c.closePath();
  g = c.createLinearGradient(0, horizon - ih, 0, horizon);
  g.addColorStop(0, '#5f717e');
  g.addColorStop(0.6, '#71838f');
  g.addColorStop(1, '#9aa8ae');
  c.fillStyle = g; c.fill();

  // 海平線薄霧帶
  g = c.createLinearGradient(0, horizon - H * 0.07, 0, horizon + H * 0.05);
  g.addColorStop(0, 'rgba(214,220,220,0)');
  g.addColorStop(0.6, 'rgba(214,220,220,0.34)');
  g.addColorStop(1, 'rgba(214,220,220,0)');
  c.fillStyle = g; c.fillRect(0, horizon - H * 0.07, W, H * 0.12);

  // 暗角
  const r = Math.hypot(W, H) / 2;
  g = c.createRadialGradient(W / 2, H * 0.45, r * 0.35, W / 2, H * 0.45, r);
  g.addColorStop(0, 'rgba(30,42,54,0)');
  g.addColorStop(1, 'rgba(30,42,54,0.34)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}

function makeMistSprite() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const c = cv.getContext('2d');
  const g = c.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(226,230,228,1)');
  g.addColorStop(0.5, 'rgba(226,230,228,0.42)');
  g.addColorStop(1, 'rgba(226,230,228,0)');
  c.fillStyle = g; c.fillRect(0, 0, 256, 256);
  return cv;
}

function buildMists() {
  mists = [];
  for (let i = 0; i < 6; i++) {
    mists.push({
      x: Math.random() * W,
      y: horizon + (Math.random() - 0.62) * H * 0.09,
      w: W * (0.5 + Math.random() * 0.5) + 200,
      h: H * (0.06 + Math.random() * 0.07),
      v: (4 + Math.random() * 7) * (Math.random() < 0.5 ? -1 : 1),
      a: 0.16 + Math.random() * 0.2,
      ph: Math.random() * 6.28
    });
  }
}

function buildWaves() {
  waves = [];
  const n = Math.round(Math.min(70, Math.max(28, W / 22)));
  for (let i = 0; i < n; i++) {
    const d = Math.pow(Math.random(), 1.7);          // 0 遠 → 1 近
    waves.push({
      x: Math.random() * W,
      y: horizon + 3 + d * (H - horizon - 6),
      len: (14 + d * 70) * Math.max(0.6, W / 1200),
      v: (3 + d * 14) * (Math.random() < 0.5 ? -1 : 1),
      a: 0.08 + d * 0.14,
      lw: 0.6 + d * 0.9,
      ph: Math.random() * 6.28,
      f: 0.3 + Math.random() * 0.5
    });
  }
}

function buildRain() {
  const n = Math.round(Math.min(420, Math.max(110, W * H / 4200)));
  rain = [];
  for (let i = 0; i < n; i++) {
    const z = Math.random();                          // 0 遠 → 1 近
    const r = { z, b: z < 0.4 ? 0 : z < 0.75 ? 1 : 2 };
    resetRain(r, true);
    rain.push(r);
  }
}

function resetRain(r, anywhere) {
  r.vy = (520 + r.z * 520) * sc;
  r.len = (9 + r.z * 15) * sc;
  r.landY = horizon + (0.02 + 0.98 * Math.pow(r.z, 1.5) * Math.random()) * (H - horizon) + 2;
  r.x = Math.random() * (W + H * 0.15);
  r.y = anywhere ? Math.random() * r.landY : -r.len - Math.random() * 80;
}

function addRipple(x, y, big) {
  if (ripples.length > 110) return;
  const d = (y - horizon) / (H - horizon);            // 越近越大
  ripples.push({ x, y, age: 0, life: 0.9 + Math.random() * 0.7, r: (5 + d * 16) * (big ? 1.25 : 1) * Math.max(0.7, sc) });
}

/* ---------- 主迴圈 ---------- */

function draw() {
  const dt = Math.min(deltaTime, 50) / 1000;
  sinceStart += dt;
  const c = drawingContext;
  image(bg, 0, 0, W, H);

  drawMist(c, dt);
  drawWaves(c, dt);
  drawRipples(c, dt);
  drawRain(c, dt);

  if (fontReady && drops.length) {
    clock += dt;
    const ci = Math.floor(clock / CYCLE);
    if (ci !== cycleIdx) { cycleIdx = ci; startCycle(); }
    updateAndDrawText(c, dt, clock - ci * CYCLE);
  }
}

function drawMist(c, dt) {
  for (const m of mists) {
    m.x += m.v * dt;
    if (m.x < -m.w / 2) m.x = W + m.w / 2;
    if (m.x > W + m.w / 2) m.x = -m.w / 2;
    c.globalAlpha = m.a * (0.75 + 0.25 * Math.sin(sinceStart * 0.2 + m.ph));
    c.drawImage(mistSprite, m.x - m.w / 2, m.y - m.h / 2, m.w, m.h);
  }
  c.globalAlpha = 1;
}

function drawWaves(c, dt) {
  c.lineCap = 'round';
  for (const w of waves) {
    w.x += w.v * dt;
    if (w.x < -w.len) w.x = W + w.len;
    if (w.x > W + w.len) w.x = -w.len;
    const k = 0.5 + 0.5 * Math.sin(sinceStart * w.f + w.ph);
    c.strokeStyle = `rgba(232,236,234,${(w.a * k).toFixed(3)})`;
    c.lineWidth = w.lw;
    const yy = w.y + Math.sin(sinceStart * w.f * 1.7 + w.ph) * 1.2;
    c.beginPath();
    c.moveTo(w.x - w.len / 2, yy);
    c.quadraticCurveTo(w.x, yy - 1.6 * w.lw, w.x + w.len / 2, yy);
    c.stroke();
  }
}

function drawRipples(c, dt) {
  c.lineWidth = 1;
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.age += dt;
    const k = r.age / r.life;
    if (k >= 1) { ripples[i] = ripples[ripples.length - 1]; ripples.pop(); continue; }
    const rr = r.r * (0.15 + 0.85 * Math.sqrt(k));
    c.strokeStyle = `rgba(236,240,238,${(0.36 * (1 - k)).toFixed(3)})`;
    c.beginPath();
    c.ellipse(r.x, r.y, rr, rr * 0.28, 0, 0, Math.PI * 2);
    c.stroke();
  }
}

function drawRain(c, dt) {
  // 開場時細雨逐漸變密
  const active = Math.floor(rain.length * ss(sinceStart / 4));
  const paths = [new Path2D(), new Path2D(), new Path2D()];
  const nx = WIND / Math.hypot(WIND, 1), ny = 1 / Math.hypot(WIND, 1);
  for (let i = 0; i < active; i++) {
    const r = rain[i];
    r.y += r.vy * dt;
    r.x += r.vy * WIND * dt;
    if (r.y >= r.landY) {
      if (Math.random() < 0.3) addRipple(r.x, r.landY, false);
      resetRain(r, false);
      continue;
    }
    const p = paths[r.b];
    p.moveTo(r.x, r.y);
    p.lineTo(r.x - nx * r.len, r.y - ny * r.len);
  }
  c.lineCap = 'round';
  const al = [0.14, 0.22, 0.32], lw = [0.7, 1.0, 1.3];
  for (let b = 0; b < 3; b++) {
    c.strokeStyle = `rgba(234,236,230,${al[b]})`;
    c.lineWidth = lw[b];
    c.stroke(paths[b]);
  }
}

function updateAndDrawText(c, dt, ct) {
  const maxSp = Math.max(380, H * 0.62);
  const maxAcc = 1500 * Math.max(0.8, sc);
  const gathering = ct < T_HOLD_END;
  const paths = [];
  for (let i = 0; i < 12; i++) paths.push(null);
  const glints = [];
  const sizes = [stepPx * 0.62, stepPx * 0.8, stepPx * 0.96];

  for (const p of drops) {
    let alpha = 0.95;

    if (p.state === 0) {
      if (!(gathering && ct >= p.delay)) continue;
      // 從畫面上方以雨滴的速度落入，之後才逐漸受到吸引
      p.state = 1; p.born = ct;
      p.vy = (380 + Math.random() * 120) * sc;
      p.vx = p.vy * WIND;
      p.x = p.tx + (Math.random() * 2 - 1) * W * 0.16 + H * 0.03;
      p.y = -Math.random() * 60 - 4;
    } else if (p.state === 4) {
      continue;
    }

    if (p.state === 1) {
      // 「抵達」轉向：期望速度隨距離遞減，加速度有上限並平滑淡入
      const blend = ss((ct - p.born) / 1.1);
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const d = Math.hypot(dx, dy) || 1e-6;
      const sp = Math.min(maxSp, d * 2.6);
      let ax = (dx / d * sp - p.vx) * 7, ay = (dy / d * sp - p.vy) * 7;
      const am = Math.hypot(ax, ay);
      if (am > maxAcc) { ax *= maxAcc / am; ay *= maxAcc / am; }
      p.vx += ax * blend * dt; p.vy += ay * blend * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      alpha = 0.35 + 0.6 * blend;
      if (d < 0.45 && Math.hypot(p.vx, p.vy) < 8) { p.state = 2; p.vx = p.vy = 0; }
      if (ct >= p.rel) p.state = 3;
    } else if (p.state === 2) {
      // 定位後：極細微的水珠顫動
      p.x = p.tx + Math.sin(ct * p.tw + p.phase) * 0.22;
      p.y = p.ty + Math.cos(ct * p.tw * 0.8 + p.phase) * 0.22;
      const s = Math.sin(ct * p.tw * 1.6 + p.phase * 3);
      if (s > 0.99) glints.push(p.x, p.y, sizes[p.sb], (s - 0.99) / 0.01);
      if (ct >= p.rel) { p.state = 3; p.vx = p.vy = 0; }
    }

    if (p.state === 3) {
      // 散落：重力平滑淡入，隨風斜落，落入海面
      const a = ss((ct - p.rel) / 0.9);
      p.vy = Math.min(p.vy + 640 * sc * a * dt, 560 * sc);
      p.vx += (p.vy * WIND - p.vx) * 2.2 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      alpha = 0.95 - 0.4 * Math.min(1, p.vy / (560 * sc));
      if (p.y >= p.landY) {
        p.state = 4;
        if (Math.random() < 0.22) addRipple(p.x, p.landY, true);
        continue;
      }
    }

    // 速度越快拖得越長（雨絲），靜止時即為一顆水珠
    const k = 0.028;
    const bi = p.sb * 4 + Math.max(0, Math.min(3, Math.round((alpha - 0.35) / 0.2)));
    const path = paths[bi] || (paths[bi] = new Path2D());
    path.moveTo(p.x - p.vx * k, p.y - p.vy * k - 0.01);
    path.lineTo(p.x, p.y);
  }

  c.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    if (!paths[i]) continue;
    c.strokeStyle = `rgba(244,240,229,${ALPHAS[i % 4]})`;
    c.lineWidth = sizes[i >> 2];
    c.stroke(paths[i]);
  }

  // 水珠閃光
  for (let i = 0; i < glints.length; i += 4) {
    c.fillStyle = `rgba(255,255,255,${(0.9 * glints[i + 3]).toFixed(3)})`;
    c.beginPath();
    c.arc(glints[i] - glints[i + 2] * 0.12, glints[i + 1] - glints[i + 2] * 0.12, glints[i + 2] * 0.6, 0, Math.PI * 2);
    c.fill();
  }
}
</script>
</body>
</html>
